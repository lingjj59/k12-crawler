# 默认配置。harvest 主要读取路径、超时、限速和 User-Agent；
# 下面的 source/base_url 等单源字段保留给旧版接口与统计兼容。
# 日常抓取用 --site/--subject 指定站点和学科。
source: cooco
base_url: http://gzwl.cooco.net.cn
# The pro. host disallows everything in robots.txt; the gzwl. host serves it.
list_url: http://gzwl.cooco.net.cn/exam_list_new/gzwl/
subject_code: gzwl
subject: 物理
subject_slug: physics
stage: 高中
question_type_filter: 选择题

db_path: data/shared/k12_high_school.sqlite
# Per-subject paths: the loader switches these to data/<subject_slug>/...
# (physics, chemistry, ...) when --subject selects another channel.
raw_dir: data/physics/raw
image_dir: data/physics/images  # legacy in-tree value; loader maps images to work/images
export_dir: data/physics
# Append-only cross-run compliance ledger (papers/questions already accepted).
ledger_path: data/shared/compliance/ledger.jsonl

timeout: 20
min_interval: 2.0
max_retries: 3
user_agent: "K12Crawler/0.6 (multi-subject educational crawler; polite single-process)"

# 兼容旧版单源接口的字段；harvest 不读取这些上限。
max_papers: 2
max_questions: 30
download_images: true

# 兼容字段；harvest 不读取该开关。
authorized: false
# 兼容字段：旧版单源流程的站点级硬上限开关；默认关闭。
limits_enabled: false
compliance_note: "采集遵守 robots.txt 与限速；站点级硬上限默认关闭（limits_enabled=false）。"
